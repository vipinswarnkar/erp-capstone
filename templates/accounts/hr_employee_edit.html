{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2>Edit Employee: {{ employee.full_name }}</h2>
        <a href="{% url 'hr_employee_list' %}" class="btn btn-outline-secondary mb-3">Back to List</a>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.employee_id.id_for_label }}" class="form-label">Employee ID</label>
                            {{ form.employee_id }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.full_name.id_for_label }}" class="form-label">Full Name</label>
                            {{ form.full_name }}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
                            {{ form.email }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.phone.id_for_label }}" class="form-label">Phone</label>
                            {{ form.phone }}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.department.id_for_label }}" class="form-label">Department</label>
                            {{ form.department }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.designation.id_for_label }}" class="form-label">Designation</label>
                            {{ form.designation }}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.role.id_for_label }}" class="form-label">Role</label>
                            {{ form.role }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.manager.id_for_label }}" class="form-label">Manager</label>
                            {{ form.manager }}
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Update Employee</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
