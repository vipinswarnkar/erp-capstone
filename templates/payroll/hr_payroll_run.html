{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2>Run Payroll</h2>
        <a href="{% url 'hr_payroll_list' %}" class="btn btn-outline-secondary mb-3">Back to Payroll List</a>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.month.id_for_label }}" class="form-label">Month</label>
                        {{ form.month }}
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.year.id_for_label }}" class="form-label">Year</label>
                        {{ form.year }}
                    </div>
                    <div class="alert alert-info">
                        <strong>Note:</strong> This will generate payroll for all active employees with salary structures. Ensure attendance is finalized before running payroll.
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Generate Payroll</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
