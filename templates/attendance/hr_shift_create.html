{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2>Create Shift</h2>
        <a href="{% url 'hr_shift_list' %}" class="btn btn-outline-secondary mb-3">Back to List</a>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.name.id_for_label }}" class="form-label">Shift Name</label>
                        {{ form.name }}
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.start_time.id_for_label }}" class="form-label">Start Time</label>
                            {{ form.start_time }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.end_time.id_for_label }}" class="form-label">End Time</label>
                            {{ form.end_time }}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="{{ form.working_hours.id_for_label }}" class="form-label">Working Hours</label>
                            {{ form.working_hours }}
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="{{ form.grace_period_minutes.id_for_label }}" class="form-label">Grace Period (minutes)</label>
                            {{ form.grace_period_minutes }}
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="{{ form.is_active.id_for_label }}" class="form-label">Active</label>
                            {{ form.is_active }}
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Create Shift</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
