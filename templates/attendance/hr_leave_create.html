{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2>Create Leave Record</h2>
        <a href="{% url 'hr_leave_list' %}" class="btn btn-outline-secondary mb-3">Back to List</a>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.employee.id_for_label }}" class="form-label">Employee</label>
                        {{ form.employee }}
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.start_date.id_for_label }}" class="form-label">Start Date</label>
                            {{ form.start_date }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.end_date.id_for_label }}" class="form-label">End Date</label>
                            {{ form.end_date }}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.leave_type.id_for_label }}" class="form-label">Leave Type</label>
                            {{ form.leave_type }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.status.id_for_label }}" class="form-label">Status</label>
                            <select name="status" class="form-control">
                                <option value="APPROVED">Approved</option>
                                <option value="PENDING">Pending</option>
                                <option value="REJECTED">Rejected</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.reason.id_for_label }}" class="form-label">Reason</label>
                        {{ form.reason }}
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Create Leave Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
